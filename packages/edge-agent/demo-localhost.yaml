# CamAI edge demo — runs the real pipeline against a local sample video and
# syncs counts to the cloud API on localhost so the dashboard shows live data.
# Tenant matches the dashboard's default ("demo-tenant").

tenant_id: demo-tenant
site_id: demo-site-01
device_id: edge-box-demo-01

detector:
  weights: yolo11n.pt   # nano baseline; auto-downloads on first run
  device: auto          # auto | cpu | cuda:0
  imgsz: 640

cloud:
  ingest_url: "http://localhost:8000"
  flush_interval_seconds: 5
  heartbeat_interval_seconds: 15

# Opt-in annotated snapshots → live view + labelling for the accuracy flywheel.
# (Applies per camera below via snapshot_seconds.)

cameras:
  # Retail entrance: a horizontal line across the middle. People crossing it
  # count as entry/exit; a zone gives browse-dwell.
  - id: cam-front-door
    source: sample.mp4        # resolved relative to the working dir the agent runs in
    mode: retail
    target_fps: 6
    min_confidence: 0.35
    snapshot_seconds: 3
    capture_dir: "capture"
    lines:
      - id: entrance
        # Vertical line down the middle — people walking across the frame cross it.
        a: { x: 0.5, y: 0.05 }
        b: { x: 0.5, y: 0.95 }
        invert: false
    zones:
      - id: shop-floor
        polygon:
          - { x: 0.05, y: 0.05 }
          - { x: 0.95, y: 0.05 }
          - { x: 0.95, y: 0.98 }
          - { x: 0.05, y: 0.98 }

  # Capacity: live headcount in the floor zone vs a limit — produces per-zone
  # occupancy samples (the occupancy chart) and capacity_breach alerts when busy.
  - id: cam-floor-capacity
    source: sample.mp4
    mode: capacity
    target_fps: 6
    min_confidence: 0.35
    snapshot_seconds: 3
    capture_dir: "capture"
    zones:
      - id: main-floor
        capacity: 0
        polygon:
          - { x: 0.03, y: 0.03 }
          - { x: 0.97, y: 0.03 }
          - { x: 0.97, y: 0.97 }
          - { x: 0.03, y: 0.97 }
