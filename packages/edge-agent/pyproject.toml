[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camai-edge"
version = "0.1.0"
description = "CamAI on-site edge agent: RTSP ingest, YOLO detect+track, mode-based counting, outbound sync"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3",      # YOLOv11 + built-in ByteTrack/BoT-SORT
    "opencv-python>=4.9",
    "pydantic>=2.5,<3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # Install the shared schema alongside:  pip install -e ../schema
    "camai-schema",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Local calibration wizard web server (run on-site, not part of the core runtime).
calibrate = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# Per-device mTLS identity (key/cert generation on first boot).
identity = ["cryptography>=42.0"]
# ONVIF camera auto-discovery (WS-Discovery itself is stdlib; this resolves RTSP URLs).
discovery = ["onvif-zeep>=0.2.12"]

[project.scripts]
camai-edge = "camai_edge.main:main"
camai-calibrate = "camai_edge.calibrate:main"

[tool.setuptools.packages.find]
include = ["camai_edge*"]

[tool.setuptools.package-data]
camai_edge = ["*.html"]
